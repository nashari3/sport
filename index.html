<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخطط بناء العضلات الشهري</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شاشة الافتتاحية بتركيب صورة البنت -->
<div id="intro-splash" class="intro-overlay">
    <div class="intro-content">
        <!-- الشعاع الضوئي -->
        <div class="energy-beam"></div>

        <!-- حاوية تركيب صورة البنت -->
        <div class="girl-assemble-box">
            <!-- الجزء العلوي (الرأس) -->
            <img src="girl.png" alt="" class="girl-piece piece-top">
            <!-- الجزء الأوسط (الجذع والدمبل) -->
            <img src="girl.png" alt="" class="girl-piece piece-mid">
            <!-- الجزء السفلي (الأرجل) -->
            <img src="girl.png" alt="" class="girl-piece piece-bot">
        </div>

        <h2 class="intro-title">فتنس تايم ✨</h2>
        <p class="intro-subtitle">رحلتكِ نحو القوة والرشاقة تبدأ الآن</p>
    </div>
</div>


    <nav class="navbar">
        <div class="container">
            <div class="logo">فتنس تايم ✨</div>
            <div class="nav-links">
                <span class="program-badge">برنامج بناء العضلات 🏋️‍♀️</span>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>جدولكِ الرياضي الشهري</h1>
            <p>منظم بالأيام الرقمية مع شروحات الصور والفيديو المباشرة للأجهزة والتمارين</p>
        </div>
    </header>

    <section class="months-section">
        <div class="container months-bar">
            <button class="month-btn active">الشهر الأول</button>
            <button class="month-btn">الشهر الثاني</button>
            <button class="month-btn">الشهر الثالث</button>
        </div>
    </section>

    <main class="container weeks-accordion-container" id="weeks-wrapper"></main>

    <footer class="footer">
        <div class="container">
            <p>صُنع بحب لمرافقتكِ في رحلة البناء والرشاقة 🌸</p>
        </div>
    </footer>

    <script>
        const baseDays = [
            {
                name: "اليوم الأول: المؤخرة والفخذ الأمامي (Glutes + Quads)",
                desc: "الهدف: زيادة امتلاء المؤخرة وتقوية الفخذ الأمامي.",
                isWarmup: true,
                exercises: [
                    { name: "Hip Thrust", target: "المؤخرة (Glutes)", sets: "3 × 10–12", id: "ex1",  video: "hip thrust.mp4" },
                    { name: "Leg Press", target: "الفخذ الأمامي (Quads)", sets: "3 × 10–12", id: "ex2", video: "leg press.mp4" },
                    { name: "Leg Extension", target: "الفخذ الأمامي (Quads)", sets: "2 × 12–15", id: "ex3", video: "leg exten.mp4" },
                    { name: "Hip Abduction", target: "المؤخرة الجانبية", sets: "2 × 15", id: "ex4", video: "hip abduction.mp4" },
                    { name: "Glute Kickback", target: "عضلات المؤخرة", sets: "2 × 12 لكل رجل", id: "ex5", video: "glute kickback.mp4" },
                    { name: "Reverse Lunge", target: "الأرجل والمؤخرة", sets: "2 × 8 لكل رجل", id: "ex6", video: "reverse lunge.mp4" },
                    { name: "Seated Calf Raise", target: "عضلات الساق (السمانة)", sets: "2 × 12–15", id: "ex7", video: "seated calf.mp4" }
                ]
            },
            {
                name: "اليوم الثاني: الظهر والذراعين (Back + Arms)",
                desc: "الهدف: تقوية الظهر والذراعين وتحسين التناسق دون تضخيم الأكتاف.",
                isWarmup: false,
                exercises: [
                    { name: "Seated Cable Row", target: "عضلات الظهر العريضة", sets: "2 × 12", id: "ex8", image: "cable-row.jpg", video: "cable-row.mp4" },
                    { name: "Chest Supported Row", target: "منتصف الظهر", sets: "2 × 12", id: "ex9", image: "chest-row.jpg", video: "chest-row.mp4" },
                    { name: "Reverse Pec Deck", target: "الظهر العلوي والكتف الخلفي", sets: "2 × 12", id: "ex10", image: "pec-deck.jpg", video: "pec-deck.mp4" },
                    { name: "Biceps Curl", target: "الذراع الأمامي (البايسبس)", sets: "2 × 12", id: "ex11", image: "biceps-curl.jpg", video: "biceps-curl.mp4" },
                    { name: "Triceps Pushdown", target: "الذراع الخلفي (الترايسبس)", sets: "2 × 12", id: "ex12", image: "triceps.jpg", video: "triceps.mp4" },
                    { name: "Chest Press", target: "عضلات الصدر", sets: "2 × 12", id: "ex13", image: "chest-press.jpg", video: "chest-press.mp4" },
                    { name: "Back Extension", target: "أسفل الظهر والدمبلز", sets: "2 × 10", id: "ex14", image: "back-extension.jpg", video: "back-extension.mp4" }
                ]
            },
            {
                name: "اليوم الثالث: المؤخرة والفخذ الخلفي (Glutes + Hamstrings)",
                desc: "الهدف: زيادة امتلاء المؤخرة وتقوية الفخذ الخلفي.",
                isWarmup: true,
                exercises: [
                    { name: "Hip Thrust", target: "عضلات المؤخرة", sets: "3 × 10–12", id: "ex15", image: "hip-thrust.jpg", video: "hip-thrust.mp4" },
                    { name: "Romanian Deadlift", target: "الفخذ الخلفي والمؤخرة", sets: "2 × 10", id: "ex16", image: "rdl.jpg", video: "rdl.mp4" },
                    { name: "Seated Leg Curl", target: "الفخذ الخلفي (Hamstrings)", sets: "3 × 12", id: "ex17", image: "leg-curl.jpg", video: "leg-curl.mp4" },
                    { name: "Glute Kickback", target: "عضلات المؤخرة", sets: "2 × 12 لكل رجل", id: "ex18", image: "glute-kickback.jpg", video: "glute-kickback.mp4" },
                    { name: "Hip Abduction", target: "المؤخرة الجانبية", sets: "2 × 15", id: "ex19", image: "hip-abduction.jpg", video: "hip-abduction.mp4" },
                    { name: "45° Back Extension", target: "أسفل الظهر والمؤخرة", sets: "2 × 10", id: "ex20", image: "45-extension.jpg", video: "45-extension.mp4" },
                    { name: "Glute Bridge", target: "عضلات المؤخرة", sets: "2 × 12", id: "ex21", image: "glute-bridge.jpg", video: "glute-bridge.mp4" }
                ]
            },
            {
                name: "اليوم الرابع: الصدر والبطن والذراعين (Chest + Core + Arms)",
                desc: "الهدف: تقوية عضلات البطن وتحسين ثبات الجذع وتناسق الذراعين.",
                isWarmup: false,
                exercises: [
                    { name: "Chest Press", target: "عضلات الصدر والذراعين", sets: "2 × 12", id: "ex22", image: "chest-press.jpg", video: "chest-press.mp4" },
                    { name: "Incline Chest Press", target: "الصدر العلوي", sets: "2 × 12", id: "ex23", image: "incline-press.jpg", video: "incline-press.mp4" },
                    { name: "Biceps Curl", target: "الذراع الأمامي", sets: "2 × 12", id: "ex24", image: "biceps-curl.jpg", video: "biceps-curl.mp4" },
                    { name: "Triceps Pushdown", target: "الذراع الخلفي", sets: "2 × 12", id: "ex25", image: "triceps.jpg", video: "triceps.mp4" },
                    { name: "Dead Bug", target: "عضلات البطن والجذع", sets: "2 × 10 لكل جهة", id: "ex26", image: "dead-bug.jpg", video: "dead-bug.mp4" },
                    { name: "Plank", target: "عضلات الجذع والثبات", sets: "2 × 15–25 ثانية", id: "ex27", image: "plank.jpg", video: "plank.mp4" },
                    { name: "Cable Pallof Press", target: "عضلات الجذع والخواصر", sets: "2 × 10 لكل جهة", id: "ex28", image: "pallof-press.jpg", video: "pallof-press.mp4" }
                ]
            }
        ];

        let html = "";

        for (let w = 1; w <= 4; w++) {
            html += '<details class="week-dropdown">' +
                    '<summary class="week-summary"><span>🗓️ الأسبوع ' + w + '</span><span class="dropdown-arrow">▼</span></summary>' +
                    '<div class="week-content">';

            baseDays.forEach((day, dIdx) => {
                html += '<details class="day-dropdown">' +
                        '<summary class="day-summary"><span class="day-title">' + day.name + '</span><span class="day-arrow">▼</span></summary>' +
                        '<div class="day-desc">' + day.desc + '</div>';

                day.exercises.forEach((ex) => {
                    let cId = 'w' + w + '-d' + dIdx + '-' + ex.id;
                    let cClass = (day.isWarmup && ex.id.endsWith('1')) ? 'card warmup-card' : 'card';

                    html += '<div class="' + cClass + '">' +
                            '<input type="checkbox" id="' + cId + '" class="done-checkbox">' +
                            '<span class="card-badge">' + ex.sets + '</span>' +
                            '<div class="card-body-layout">' +
                                '<div class="card-info">' +
                                    '<h3 class="exercise-name">' + ex.name + '</h3>' +
                                    '<p class="exercise-target">🎯 ' + ex.target + '</p>' +
                                '</div>' +
                                '<div class="card-media-wrapper">' +
                                    '<div class="media-box-item">' +
                                        '<video src="' + ex.video + '" controls muted loop playsinline></video>' +
                                    '</div>' +
                                '</div>' +
                            '</div>' +
                        '</div>';
                });


                html += '</details>';
            });

            html += '</div></details>';
        }

        document.getElementById("weeks-wrapper").innerHTML = html;
    </script>
</body>
</html>
